services:
  frontend:
    image: nginx:1.27-alpine
    container_name: frontend
    ports:
      - "8080:80"
    volumes:
      - ./frontend:/usr/share/nginx/html:ro
      - ./frontend/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      backend:
        condition: service_healthy
      renderer:
        condition: service_started
    restart: on-failure

  renderer:
    build:
      context: .
      dockerfile: renderer/Dockerfile
      args:
        BUILD_MODE: WORKER
        BUILD_TESTS: OFF
    container_name: renderer
    command: [ "service" ]
    hostname: renderer
    depends_on:
      minio:
        condition: service_healthy
      kafka:
        condition: service_healthy
    restart: on-failure

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: backend
    hostname: backend
    environment:
      DATABASE__HOST: database
      DATABASE__PORT: 5432
      DATABASE__DB_NAME: renderer

      MINIO__HOST: minio
      MINIO__PORT: 9000

      MINIO__USERNAME: adminadmin
      MINIO__PASSWORD: adminadmin
    volumes:
      - "./backend:/backend"
    ports:
      - "8000:8000"
    depends_on:
      database:
        condition: service_healthy
      minio:
        condition: service_healthy
      kafka:
        condition: service_started
    healthcheck:
      test: ["CMD", "curl", "-f", "localhost:8000/health"]
      start_period: 2s
      interval: 2s
      timeout: 2s
      retries: 3
    restart: on-failure

  outbox-worker:
    build:
      context: .
      dockerfile: backend/Dockerfile
    command: ["python", "./outbox_worker/main.py"]
    container_name: outbox-worker
    hostname: outbox-worker
    environment:
      PYTHONPATH: /backend

      DATABASE__HOST: database
      DATABASE__PORT: 5432
      DATABASE__DB_NAME: renderer
    volumes:
      - "./backend:/backend"
    depends_on:
      database:
        condition: service_healthy
      kafka:
        condition: service_started
    healthcheck:
      test: [ "CMD", "curl", "-f", "localhost:8000/health" ]
      start_period: 2s
      interval: 2s
      timeout: 2s
      retries: 3
    restart: on-failure

  database:
    image: postgres:17-bookworm
    container_name: database
    hostname: database
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: renderer
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d renderer"]
      start_period: 3s
      interval: 2s
      timeout: 2s
      retries: 3
    restart: on-failure

  minio:
    image: quay.io/minio/minio
    container_name: minio
    hostname: minio
    command: server --console-address ":9001" /data
    environment:
      MINIO_ROOT_USER: adminadmin
      MINIO_ROOT_PASSWORD: adminadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f","http://localhost:9000/minio/health/ready"]
      start_period: 2s
      interval: 2s
      timeout: 2s
      retries: 3
    restart: on-failure

  kafka:
    image: confluentinc/cp-kafka:latest
    container_name: kafka
    hostname: kafka
    healthcheck:
      test: ["CMD-SHELL", "kafka-broker-api-versions --bootstrap-server localhost:9092 || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 15s
    environment:
      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: "broker,controller"

      # Открываем порты(даем им имена) внутри контейнера,
      # которые слушают все ip интерфейсы
      KAFKA_LISTENERS: "INTERNAL://:9092, EXTERNAL://:9093, CONTROLLER://:29093"

      # Открытому порту внутри контейнера, даем хост:порт,
      # с которого подключаемся к открытому порту в контейнере
      KAFKA_ADVERTISED_LISTENERS: "INTERNAL://kafka:9092, EXTERNAL://localhost:9093"
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: "INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT"

      KAFKA_CONTROLLER_QUORUM_VOTERS: "1@kafka:29093"
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"

      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
    ports:
      - "9093:9093"
    restart: on-failure

  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: kafka-ui
    hostname: kafka-ui
    environment:
      KAFKA_CLUSTERS_0_NAME: kafka-cluster
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: "kafka:9092"
      KAFKA_CLUSTERS_0_PROPERTIES_AUTO_CREATE_TOPICS: true
    ports:
      - "8090:8080"
    depends_on:
      kafka:
        condition: service_started
    restart: on-failure

  promtail:
    image: grafana/promtail:latest
    container_name: promtail
    ports:
      - "9080:9080"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ./promtail-config.yml:/etc/promtail/config.yml
    command: -config.file=/etc/promtail/config.yml
    depends_on:
      - loki

  loki:
    image: grafana/loki:latest
    container_name: loki
    ports:
      - "3100:3100"
    volumes:
      - ./loki-config.yml:/etc/loki/local-config.yaml

  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus-config.yml:/etc/prometheus/prometheus.yml
      - prometheus_data:/prometheus

  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    ports:
      - "9091:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
    volumes:
      - ./grafana/provisioning/datasources-config.yml:/etc/grafana/provisioning/datasources/datasources.yaml
      - ./grafana/dashboards:/var/lib/grafana/dashboards
      - ./grafana/provisioning/dashboards-config.yml:/etc/grafana/provisioning/dashboards/dashboards.yaml
      - grafana_data:/var/lib/grafana
    depends_on:
      - prometheus
      - loki


volumes:
  minio_data:
  postgres_data:
  prometheus_data:
  grafana_data: