<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>PriZm — Регистрация</title><link rel="stylesheet" href="style.css"><link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"></head><body class="auth-page"><main class="auth-container"><section class="auth-card"><div class="auth-header"><i class="fas fa-cube"></i><h1>Создать аккаунт</h1><p>Начните создавать проекты в PriZm</p></div><form id="registerForm"><div class="form-row"><div class="form-group"><label for="surname">Фамилия</label><input id="surname" required></div><div class="form-group"><label for="name">Имя</label><input id="name" required></div></div><div class="form-group"><label for="username">Имя пользователя</label><input id="username" autocomplete="username" required></div><div class="form-group"><label for="email">Email</label><input id="email" type="email" autocomplete="email" required></div><div class="form-group"><label for="password">Пароль</label><input id="password" type="password" autocomplete="new-password" minlength="8" required></div><div class="form-group"><label for="confirmPassword">Подтверждение пароля</label><input id="confirmPassword" type="password" autocomplete="new-password" minlength="8" required></div><button class="btn btn-primary btn-block" type="submit"><i class="fas fa-user-plus"></i> Зарегистрироваться</button><div class="auth-footer">Уже есть аккаунт? <a href="login.html">Войти</a></div></form><div id="registerError" class="error-message" style="display:none"></div></section></main><script src="script.js"></script></body></html>
